    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>
<body>
    <div class="top-bar">
        <div class="container">
            <div class="contact-info">
                <span><i class="fas fa-phone-alt"></i> (555) 123-4567</span>
                <span><i class="fas fa-envelope"></i> info@crosslife.edu</span>
            </div>
            <div class="social-links">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </div>

    <nav class="main-nav">
        <div class="container">
            <div class="logo">
                <a href="index.html">Cross Life School of Divinity</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="accreditation.html">Accreditation</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="register.html" class="signup-btn">Sign Up</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero" style="padding: 60px 0;">
        <div class="container" style="max-width: 400px;">
            <h1>Student Login</h1>
            
            <div style="background: white; padding: 40px; border-radius: 10px; text-align: left;">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; color: #333; font-weight: 600;">Email</label>
                    <input type="email" id="email" placeholder="your@email.com" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; color: #333; font-weight: 600;">Password</label>
                    <input type="password" id="password" placeholder="********" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                </div>

                <button onclick="alert('Login functionality coming soon!')" style="width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">Login</button>

                <p style="margin-top: 20px; text-align: center;">
                    Don't have an account? <a href="register.html" style="color: #3498db;">Register here</a>
                </p>
                <p style="text-align: center;">
                    <a href="#" style="color: #3498db;">Forgot Password?</a>
                </p>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Cross Life School of Divinity. All rights reserved.</p>
            </div>
